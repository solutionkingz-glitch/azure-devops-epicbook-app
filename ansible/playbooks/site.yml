---
- name: Common setup on all hosts
  hosts: all
  roles:
    - common

- name: Configure frontend (nginx)
  hosts: frontend
  roles:
    - frontend

- name: Configure backend (node)
  hosts: backend
  roles:
    - backend

- name: Configure backend (node)
  hosts: backend
  roles:
    - backend

- name: Prepare database (from backend VM)
  hosts: backend
  roles:
    - database

- name: Verify deployment
  hosts: all
  roles:
    - verify
