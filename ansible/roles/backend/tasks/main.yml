---
- name: Install prerequisites for NodeSource
  ansible.builtin.apt:
    name:
      - gnupg
      - ca-certificates
      - curl
    state: present
  become: true

- name: Add NodeSource signing key
  ansible.builtin.shell: |
    set -o pipefail
    curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key | gpg --dearmor -o /usr/share/keyrings/nodesource.gpg
  args:
    creates: /usr/share/keyrings/nodesource.gpg
    executable: /bin/bash
  become: true

- name: Add NodeSource repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/nodesource.gpg] https://deb.nodesource.com/node_{{ node_major }}.x nodistro main"
    filename: nodesource
    state: present
  become: true

- name: Install Node.js and MySQL client
  ansible.builtin.apt:
    name:
      - nodejs
      - mysql-client
    state: present
    update_cache: true
  become: true

- name: Create application user
  ansible.builtin.user:
    name: "{{ app_user }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ app_dir }}"
    create_home: false
  become: true

- name: Create application directory
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0755"
  become: true

- name: Copy application code
  ansible.builtin.synchronize:
    src: "{{ playbook_dir }}/../../"
    dest: "{{ app_dir }}/"
    delete: false
    owner: false
    group: false
    perms: false
    rsync_opts:
      - "--exclude=.git"
      - "--exclude=ansible"
      - "--exclude=node_modules"
      - "--exclude=azure-pipelines.yml"
  become: true
  register: app_code

- name: Fix ownership of application files
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    recurse: true
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
  become: true
  when: app_code is changed

- name: Install dependencies from lock file
  ansible.builtin.command: npm ci --omit=dev
  args:
    chdir: "{{ app_dir }}"
  become: true
  become_user: "{{ app_user }}"
  when: app_code is changed

- name: Create env directory
  ansible.builtin.file:
    path: /etc/epicbook
    state: directory
    owner: root
    group: "{{ app_user }}"
    mode: "0750"
  become: true

- name: Deploy protected env file
  ansible.builtin.template:
    src: epicbook.env.j2
    dest: /etc/epicbook/epicbook.env
    owner: root
    group: "{{ app_user }}"
    mode: "0640"
  become: true
  no_log: true
  notify: Restart epicbook

- name: Deploy systemd unit
  ansible.builtin.template:
    src: epicbook.service.j2
    dest: /etc/systemd/system/epicbook.service
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Restart epicbook

- name: Enable and start epicbook
  ansible.builtin.systemd:
    name: epicbook
    enabled: true
    state: started
    daemon_reload: true
  become: true
